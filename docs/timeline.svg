<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 250" width="910" height="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="908" height="248" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="30" y="46" font-size="22" font-weight="700" fill="#111827">When does a sensor turn on?</text>

  <!-- Day backgrounds: 60..450 = day before, 450..840 = collection day (16.25 px per hour) -->
  <rect x="60" y="90" width="390" height="70" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect x="450" y="90" width="390" height="70" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="255" y="186" font-size="14" fill="#4b5563" text-anchor="middle">Day before</text>
  <text x="645" y="186" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Collection day</text>

  <!-- ON bar: 18:00 day before (x=352.5) to 12:00 collection day (x=645) -->
  <rect x="352.5" y="100" width="292.5" height="50" rx="8" fill="#16a34a"/>
  <text x="498.75" y="131" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Sensor ON: put the bin out</text>

  <!-- Markers -->
  <line x1="352.5" y1="78" x2="352.5" y2="160" stroke="#14532d" stroke-width="2"/>
  <text x="352.5" y="72" font-size="13" font-weight="600" fill="#14532d" text-anchor="middle">18:00</text>
  <line x1="645" y1="78" x2="645" y2="160" stroke="#14532d" stroke-width="2"/>
  <text x="645" y="72" font-size="13" font-weight="600" fill="#14532d" text-anchor="middle">12:00</text>
  <text x="450" y="72" font-size="12" fill="#9ca3af" text-anchor="middle">midnight</text>
  <line x1="450" y1="78" x2="450" y2="90" stroke="#9ca3af" stroke-width="1"/>

  <text x="30" y="226" font-size="13" fill="#6b7280">Both times can be changed in the settings: alertTime (default 18:00) and endTime (default 12:00).</text>
</svg>
